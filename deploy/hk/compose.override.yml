# 香港服务器“仅 IP、无 HTTPS”试运行：复用生产镜像与 compose.yml，只覆盖访问地址和端口。
# 用户端：公网 http://<服务器IP>（80）。管理后台：只绑定服务器 127.0.0.1:8081，经 SSH 隧道访问。
# 有域名后改回生产 Caddy（WEB_DOMAIN/ADMIN_DOMAIN 填域名、开放 443），去掉本文件。
services:
  migrate:
    environment:
      ALLOW_IP_HTTP: '1'
      MEDIA_PUBLIC_BASE_URL: http://${WEB_HOST:?Set server IP}
  app:
    environment:
      ALLOW_IP_HTTP: '1'
      MEDIA_PUBLIC_BASE_URL: http://${WEB_HOST:?Set server IP}
    # ADR-0031：经内部网络 weiban-llm 访问 sub2api（http://sub2api:8080）。
    # 网络由 deploy/hk/sub2api/setup.sh 创建（docker network create --internal weiban-llm）。
    networks: [private, outbound, llm]
  caddy:
    environment:
      WEB_DOMAIN: ':80'
      ADMIN_DOMAIN: ':8081'
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:?Set tunnel admin origin}
    ports: !override
      - '80:80'
      - '127.0.0.1:8081:8081'
networks:
  llm:
    external: true
    name: weiban-llm
