# sub2api（ADR-0031 方案 A）· 香港服务器独立 Compose 项目
# 基于官方 deploy/docker-compose.local.yml（v0.2.15），改动：镜像固定版本、只绑 127.0.0.1、资源上限、
# 加入内部网络 weiban-llm（微伴 app 经 http://sub2api:8080 访问）。
# 运行目录 /srv/weiban/sub2api（数据盘）：.env（600，秘密）、data/、postgres_data/、redis_data/。
# 启动：cd /srv/weiban/sub2api && docker compose -p sub2api up -d --wait
name: sub2api
services:
  sub2api:
    image: weishaw/sub2api:0.2.15
    container_name: sub2api
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    ports:
      - '127.0.0.1:8090:8080'
    volumes:
      - ./data:/app/data
    environment:
      AUTO_SETUP: 'true'
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: '20'
      DATABASE_MAX_IDLE_CONNS: '5'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: '0'
      REDIS_POOL_SIZE: '64'
      REDIS_MIN_IDLE_CONNS: '4'
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_HOUR: '24'
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      LOG_OUTPUT_TO_FILE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      llm:
        aliases: [sub2api]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  postgres:
    image: postgres:18.6-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sub2api
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sub2api -d sub2api']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:8.10.2-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./redis_data:/data
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes', '--appendfsync', 'everysec',
      '--maxmemory', '96mb', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  default: {}
  # 内部网络（无外网出口）：只用于微伴 app → sub2api。由 setup 脚本预先创建：
  # docker network create --internal weiban-llm
  llm:
    external: true
    name: weiban-llm
