name: weiban-prod
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: weiban
      POSTGRES_DB: weiban
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
      PGTZ: UTC
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U weiban -d weiban']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  migrate:
    image: ${APP_IMAGE:-weiban-app:local}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
      target: app
    command: ['node', 'dist/migrate.js', 'up']
    environment: &app_environment
      NODE_ENV: production
      APP_ROLE: all
      HOST: 0.0.0.0
      PORT: 3000
      HTTP_TRUST_PROXY: '1'
      IMAGE_PUBLIC_SEARCH_ENABLED: ${IMAGE_PUBLIC_SEARCH_ENABLED:-0}
      CHARACTER_PUBLIC_PICTURE_SEARCH_ENABLED: ${CHARACTER_PUBLIC_PICTURE_SEARCH_ENABLED:-0}
      DATABASE_URL_FILE: /run/secrets/database_url
      PLATFORM_KEK_FILE: /run/secrets/kek
      PLATFORM_KEK_VERSION: ${PLATFORM_KEK_VERSION:-1}
      BILLING_PLATFORM_DAILY_CAP_MICROS: ${BILLING_PLATFORM_DAILY_CAP_MICROS:?Set platform cost limit in micros}
      MEDIA_DISK_ROOT: /app/.data/media
      MEDIA_PUBLIC_BASE_URL: https://${WEB_HOST:?Set public web hostname}
      # 外部渠道接入（微信 iLink / 微博 OpenIM，契约 3.42）。compose 是显式白名单，
      # 不在这里传的变量容器里根本看不到。默认全关：不打开时页面显示「未联调」，
      # worker 不连微信也不连微博、不发送任何东西。
      # *ALLOWED_USER_IDS 是内测白名单（逗号分隔用户 UUID）；留空 = 谁都不能用。
      CHANNEL_QQ_ENABLED: ${CHANNEL_QQ_ENABLED:-0}
      CHANNEL_QQ_ALLOWED_USER_IDS: ${CHANNEL_QQ_ALLOWED_USER_IDS:-}
      CHANNEL_WECHAT_ENABLED: ${CHANNEL_WECHAT_ENABLED:-0}
      CHANNEL_WECHAT_ALLOWED_USER_IDS: ${CHANNEL_WECHAT_ALLOWED_USER_IDS:-}
      CHANNEL_WECHAT_ILINK_BASE_URL: ${CHANNEL_WECHAT_ILINK_BASE_URL:-https://ilinkai.weixin.qq.com}
      CHANNEL_WEIBO_ENABLED: ${CHANNEL_WEIBO_ENABLED:-0}
      CHANNEL_WEIBO_ALLOWED_USER_IDS: ${CHANNEL_WEIBO_ALLOWED_USER_IDS:-}
      CHANNEL_WEIBO_TOKEN_ENDPOINT: ${CHANNEL_WEIBO_TOKEN_ENDPOINT:-https://open-im.api.weibo.com/open/auth/ws_token}
      CHANNEL_WEIBO_WS_ENDPOINT: ${CHANNEL_WEIBO_WS_ENDPOINT:-wss://open-im.api.weibo.com/ws/stream}
    secrets: [database_url, kek]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: 'no'
  app:
    image: ${APP_IMAGE:-weiban-app:local}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
      target: app
    restart: unless-stopped
    environment: *app_environment
    secrets: [database_url, kek]
    volumes: [media:/app/.data/media]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    networks: [private, outbound]
  caddy:
    image: ${EDGE_IMAGE:-weiban-edge:local}
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
      target: edge
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set web TLS domain}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set admin TLS domain}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:?Set full public admin HTTPS origin}
      NO_PROXY: app,postgres,localhost,127.0.0.1
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      app:
        condition: service_healthy
    networks: [private, outbound]
secrets:
  postgres_password:
    file: ${SECRETS_DIR:?Set secrets directory}/postgres-password
  database_url:
    file: ${SECRETS_DIR}/database-url
  kek:
    file: ${SECRETS_DIR}/kek
volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
networks:
  private:
    internal: true
  outbound:
